            - heading "Understanding Chargent Custom Checkout" [level=2] [ref=f4e298]
            - generic [ref=f4e299]:
              - generic [ref=f4e301] [cursor=pointer]
              - generic [ref=f4e313]:
                - paragraph [ref=f4e314]:
                  - text: Everything your customers see and interact with should align with your company branding. Chargent Custom Checkout (CCC) allows your development team to create a fully custom front-end payment experience on your
                  - link "Salesforce Experience Cloud Site" [ref=f4e315] [cursor=pointer]:
                    - /url: https://help.salesforce.com/s/articleView?id=sf.networks_overview.htm&type=5
                  - text: .
                - paragraph [ref=f4e316]: Using CCC, you can create secure, pixel-perfect payment pages that match the look and feel of your company’s branding. Colors, fonts, spacing, and sizing can all match your site – you name it.
                - figure [ref=f4e318]
                - paragraph [ref=f4e319]: "Additionally, CCC includes the following functionality:"
                - list [ref=f4e320]:
                  - listitem [ref=f4e321]: Customize what fields are displayed or required.
                  - listitem [ref=f4e322]:
                    - text: Add custom error messaging to ensure that your customers know which inputs need attention
                    - emphasis [ref=f4e323]: before
                    - text: the payment is submitted.
                - heading "Prerequisites" [level=2] [ref=f4e324]
                - list [ref=f4e325]:
                  - listitem [ref=f4e326]:
                    - text: You must be on the latest version of Chargent to use the CCC Library, which can be installed or updated using our
                    - link "Package Installation Manager (PIM)" [ref=f4e327] [cursor=pointer]:
                      - /url: /chargent-installation
                    - text: .
                  - listitem [ref=f4e328]:
                    - text: Chargent Custom Checkout is offered as part of Chargent’s Growth or Enterprise Editions. For more information, see our
                    - link "Pricing Page" [ref=f4e329] [cursor=pointer]:
                      - /url: /pricing
                    - text: .
                  - listitem [ref=f4e330]:
                    - text: Chargent Custom Checkout is a pro-code solution recommended only for experienced Salesforce Developers. See our
                    - link "Developer Documentation" [ref=f4e331] [cursor=pointer]:
                      - /url: https://developers.appfrontier.com/docs/ccc/introduction
                    - text: for technical guidance.
                - heading "Take Payment vs. Chargent Custom Checkout" [level=2] [ref=f4e332]
                - paragraph [ref=f4e333]: Chargent offers two solutions, the Take Payment component and Chargent Custom Checkout, that enable you to take payments directly from your Salesforce Community.
                - paragraph [ref=f4e334]:
                  - strong [ref=f4e335]: Take Payment
                  - text: is a component designed to be set up in minutes, so no coding or developer work is required. The component works on any object and fits in any page layout. Since Take Payment is a declarative solution, you cannot change the UI’s position, colors, or style. To learn more about Take Payment,
                  - link "see our documentation here" [ref=f4e336] [cursor=pointer]:
                    - /url: /documentation/take-payments-lightning-web-component-lwc
                  - text: .
                - paragraph [ref=f4e337]:
                  - strong [ref=f4e338]: Chargent Custom Checkout
                  - text: is a pro-code alternative to the Chargent Take Payment component with added flexibility, allowing you to create a fully branded payment experience. CCC can also save money and customer time by allowing you to create custom error messages that prevent unproductive transaction attempts before they occur.
                - heading "Chargent Custom Checkout Library" [level=2] [ref=f4e339]
                - paragraph [ref=f4e340]: The CCC Library allows developers to implement a custom checkout UI while seamlessly leveraging Chargent’s functionalities. The library is available for Lightning Web Components and Visualforce Pages.
                - paragraph [ref=f4e341]:
                  - text: Please see our
                  - link "Developer Guide" [ref=f4e342] [cursor=pointer]:
                    - /url: https://developers.appfrontier.com/docs/ccc/introduction
                  - text: for more information about the Chargent Custom Checkout Library.
                - heading [level=3] [ref=f4e343]:
                  - strong [ref=f4e344]: See Also
                - paragraph [ref=f4e345]:
                  - link "Lightning Web Components" [ref=f4e346] [cursor=pointer]:
                    - /url: https://developer.salesforce.com/docs/component-library/documentation/en/lwc
                  - link "What is Visualforce?" [ref=f4e347] [cursor=pointer]:
                    - /url: https://developer.salesforce.com/docs/atlas.en-us.pages.meta/pages/pages_intro_what_is_it.htm
                  - link "Take Payment Component" [ref=f4e348] [cursor=pointer]:
                    - /url: /documentation/take-payments-lightning-web-component-lwc
