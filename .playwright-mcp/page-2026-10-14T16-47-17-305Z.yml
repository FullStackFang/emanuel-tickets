            - generic [ref=f6e60]:
              - heading "Introduction" [level=1] [ref=f6e61]
              - heading [level=2] [ref=f6e62]:
                - text: Overview
                - link "Direct link to Overview" [ref=f6e63] [cursor=pointer]:
                  - /url: "#overview"
                  - text: "#"
              - paragraph [ref=f6e64]: Chargent REST API is a payment processing solution that helps businesses accept and process payments online.
              - heading [level=3] [ref=f6e65]:
                - text: Objects
                - link "Direct link to Objects" [ref=f6e66] [cursor=pointer]:
                  - /url: "#objects"
                  - text: "#"
              - paragraph [ref=f6e67]: There are six objects involved in Chargent REST API requests and responses.
              - table [ref=f6e68]:
                - rowgroup [ref=f6e69]:
                  - row [ref=f6e70]:
                    - columnheader "Object" [ref=f6e71]
                    - columnheader "Definition" [ref=f6e72]
                - rowgroup [ref=f6e73]:
                  - row [ref=f6e74]:
                    - cell [ref=f6e75]:
                      - link "Chargent Order" [ref=f6e76] [cursor=pointer]:
                        - /url: https://appfrontier.com/documentation/chargent-order-fields
                    - cell "Chargent Orders contain information related to the order such as billing information, total amount, due balance, and charge amount. They are central objects to payments lifecycle management." [ref=f6e77]
                  - row [ref=f6e78]:
                    - cell [ref=f6e79]:
                      - link "Payment Gateway" [ref=f6e80] [cursor=pointer]:
                        - /url: https://appfrontier.com/documentation/gateway-fields
                    - cell "Payment Gateways track all the configuration settings that Chargent will use to proccess the payments and send requests to the gateway." [ref=f6e81]
                  - row [ref=f6e82]:
                    - cell "Payment Method" [ref=f6e83]
                    - cell "Payment Methods are items that may be used to make or take payment." [ref=f6e84]
                  - row [ref=f6e85]:
                    - cell "Token" [ref=f6e86]
                    - cell "Tokens are the strings used to represent the payment instrument account details at the gateway or other payment service provider. Payment tokens replace sensitive payment account data with a different data called a “token” and the token strings cannot be decrypted." [ref=f6e87]
                  - row [ref=f6e88]:
                    - cell [ref=f6e89]:
                      - link "Chargent Transaction" [ref=f6e90] [cursor=pointer]:
                        - /url: https://appfrontier.com/documentation/chargent-transaction-fields
                    - cell "Transactions record the results of the requests made to the payment gateway on the Chargent Order. Transactions are also used to make additional requests in the payments lifecycle." [ref=f6e91]
                  - row [ref=f6e92]:
                    - cell "Log" [ref=f6e93]
                    - cell "The Chargent Log object retains the history of actions taken in Chargent." [ref=f6e94]
              - heading [level=3] [ref=f6e95]:
                - text: Payments Lifecycle
                - link "Direct link to Payments Lifecycle" [ref=f6e96] [cursor=pointer]:
                  - /url: "#payments-lifecycle"
                  - text: "#"
              - paragraph [ref=f6e97]: "Businesses have many different needs for payment processing workflows. The general sequence of operations to create a successful payment Sale operation includes the following five steps:"
              - list [ref=f6e98]:
                - listitem [ref=f6e99]: Create Payment Gateway
                - listitem [ref=f6e100]: Create Payment Method
                - listitem [ref=f6e101]: Create Chargent Order
                - listitem [ref=f6e102]: Create Payment Authorization
                - listitem [ref=f6e103]: Create Payment Capture
              - paragraph [ref=f6e104]: Many varitions on this workflow exist, and this sequence may also be followed with additional operations, such as Void and Refund. Additionally, a Sale operation combines an Authorization and Capture into a single payment operation.
              - heading [level=2] [ref=f6e105]:
                - text: Headless Requests
                - link "Direct link to Headless Requests" [ref=f6e106] [cursor=pointer]:
                  - /url: "#headless-requests"
                  - text: "#"
              - paragraph [ref=f6e107]: Add the Chargent-Headless HTTP Header to the POST request and Chargent will not store payment gateway response data in Salesforce.
              - heading [level=3] [ref=f6e108]:
                - text: Methods
                - link "Direct link to Methods" [ref=f6e109] [cursor=pointer]:
                  - /url: "#methods"
                  - text: "#"
              - paragraph [ref=f6e110]: Chargent supports two methods for headless requests.
              - table [ref=f6e111]:
                - rowgroup [ref=f6e112]:
                  - row [ref=f6e113]:
                    - columnheader "Method" [ref=f6e114]
                    - columnheader "Definition" [ref=f6e115]
                - rowgroup [ref=f6e116]:
                  - row [ref=f6e117]:
                    - cell [ref=f6e118]:
                      - link "Payment Method Tokenization" [ref=f6e119] [cursor=pointer]:
                        - /url: /docs/rest/payment-method-tokenization#headless-tokenization
                    - cell "Payment Method Tokenization is the exchange of payment data for a token representation provided by the payment gateway for PCI Compliance. This is an initial step in the payments lifecycle." [ref=f6e120]
                  - row [ref=f6e121]:
                    - cell [ref=f6e122]:
                      - link "Payment Sale" [ref=f6e123] [cursor=pointer]:
                        - /url: /docs/rest/payment-sale#headless-sale
                    - cell "Payment Sale will perform both a Payment Authorization and a Payment Capture in a single payment operation request." [ref=f6e124]
              - heading [level=2] [ref=f6e125]:
                - text: Learn More
                - link "Direct link to Learn More" [ref=f6e126] [cursor=pointer]:
