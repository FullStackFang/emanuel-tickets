            - heading "Chargent Payments API" [level=2] [ref=e298]
            - generic [ref=e299]:
              - generic [ref=e301] [cursor=pointer]
              - generic [ref=e313]:
                - paragraph [ref=e314]: Do you have a customized Salesforce org that requires a programmatic solution? Are your developers itching to generate a wholly specialized payment process? Chargent’s got you covered with Chargent’s Payments API.
                - paragraph [ref=e315]: Chargent’s Payments API allows you to connect payments from any external system to Salesforce via Chargent, delivering payment processing to fit your specific business needs. These web services are available as an extension of Salesforce’s standard REST API, so they can be called in the same way that you interact with other parts of the Salesforce API.
                - blockquote [ref=e316]:
                  - paragraph [ref=e317]:
                    - emphasis [ref=e318]:
                      - strong [ref=e319]: "Note:"
                      - text: Development using Chargent’s Payments API requires Chargent’s Growth or Enterprise Edition. For more information about our editions, visit our
                      - link "Pricing page" [ref=e320] [cursor=pointer]:
                        - /url: https://appfrontier.com/pricing
                      - text: .
                - heading "Dev Docs" [level=2] [ref=e321]
                - paragraph [ref=e322]: Our website is dedicated to providing comprehensive declarative content for Chargent. To support your development efforts, we’ve created a Developer Documentation website that provides information specific to the Chargent Payments API and other pro-code tools.
                - paragraph [ref=e323]:
                  - text: Visit our
                  - link "Developer Documentation" [ref=e324] [cursor=pointer]:
                    - /url: https://developers.appfrontier.com/
                  - text: to start creating custom programmatic solutions today.
                - heading "API Interfaces" [level=2] [ref=e325]
                - paragraph [ref=e326]: Chargent’s API was written for multiple interfaces in Salesforce, including REST, Apex, and Flow to offer flexibility and ease of integration to meet your specific development needs.
                - heading "REST API" [level=3] [ref=e327]
                - paragraph [ref=e328]:
                  - text: Our RESTful API allows developers to interact with the Accounts Receivable Payments system using standard HTTPS methods. This interface is ideal for building scalable and secure integrations across various platforms and programming languages. Detailed endpoints, request/response examples, and authentication mechanisms are documented to streamline your development process. Learn more about
                  - link "REST API" [ref=e329] [cursor=pointer]:
                    - /url: https://developers.appfrontier.com/docs/rest/introduction
                  - text: .
                - heading "Flow Integration" [level=3] [ref=e330]
                - paragraph [ref=e331]:
                  - text: For developers who prefer a low-code approach, our Flow interface simplifies the integration process. Leverage the power of Salesforce Flow to design automated, visual workflows that seamlessly connect with the Chargent Payments API. Explore the step-by-step guide, use cases, and examples to unlock the full potential of this integration. Learn more about
                  - link "Flow Integration" [ref=e332] [cursor=pointer]:
                    - /url: https://developers.appfrontier.com/docs/flow/introduction
                - heading "Apex Development" [level=3] [ref=e333]
                - paragraph [ref=e334]:
                  - text: For maximum customization and control, developers can utilize the Apex programming language to integrate the Chargent Payments API directly into their Salesforce applications. The Apex interface offers programmatic access to the API’s functionality, enabling developers to tailor solutions to specific business requirements. Learn more about
                  - link "Apex Development" [ref=e335] [cursor=pointer]:
                    - /url: https://developers.appfrontier.com/docs/apex/introduction
                  - text: .
                - heading "Supported Methods" [level=2] [ref=e336]
                - paragraph [ref=e337]: With Chargent’s API, you can call Chargent methods directly from inside Salesforce without a user initiating them, such as from a customized Visualforce interface.
                - paragraph [ref=e338]: "Chargent’s API allows you to call actions programmatically. The following are examples of actions possible using the Chargent Payments API:"
                - list [ref=e339]:
                  - listitem [ref=e340]:
                    - text: Chargent Orders
                    - list [ref=e341]:
                      - listitem [ref=e342]: Create Recurring Chargent Order
                      - listitem [ref=e343]: Create One-Time Chargent Order
                      - listitem [ref=e344]: Create Credit Chargent Order
                      - listitem [ref=e345]: Create Chargent Order Credit
                      - listitem [ref=e346]: Create Chargent Order Unlinked Refund
                  - listitem [ref=e347]:
                    - text: Payment Methods
                    - list [ref=e348]:
                      - listitem [ref=e349]: Create Payment Method
                      - listitem [ref=e350]: Assign Payment Method to Chargent Order
                      - listitem [ref=e351]: Unassign Payment Method to Chargent Order
                  - listitem [ref=e352]:
                    - text: Tokenization
                    - list [ref=e353]:
                      - listitem [ref=e354]: Multiple Gateway Tokenization
                      - listitem [ref=e355]: Headless Tokenization
                      - listitem [ref=e356]: Import Payment Method Tokens
                  - listitem [ref=e357]:
                    - text: Chargent Transactions
                    - list [ref=e358]:
                      - listitem [ref=e359]: Create Payment Authorization Methods
                      - listitem [ref=e360]: Create Payment Authorization
                      - listitem [ref=e361]: Create Payment Authorization Reversal
                      - listitem [ref=e362]: Create Payment Authorization Capture
                      - listitem [ref=e363]: Create Payment Sale
                      - listitem [ref=e364]: Headless Sale
                      - listitem [ref=e365]: Create Full Payment Refund
                      - listitem [ref=e366]: Create Partial Payment Refund
                  - listitem [ref=e367]:
                    - text: Payment Request
                    - list [ref=e368]:
                      - listitem [ref=e369]: Create Payment Request
                - paragraph [ref=e370]:
                  - text: For complete information regarding the supported methods, please visit our
                  - link "Developer Documentation Website" [ref=e371] [cursor=pointer]:
                    - /url: https://developers.appfrontier.com/
                  - text: .
